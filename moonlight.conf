## Moonlight Wii U Configuration
## Lines starting with '#' are comments, to edit an option uncomment it by removing the '#'

## Hostname or IP-address of host to connect to
#address = 1.2.3.4

## Video streaming configuration
#width = 1280
#height = 720
#fps = 30

## Disables the gamepad so the other controllers are mapped to players 1 to 4
#disable_gamepad = true

## Swaps the buttons so they match the xbox controller layout
#swap_buttons = true

## Automatically connect to the host on startup and start the stream
#autostream = true

## Changes the way touchscreen inputs are sent to the host
## relative (default) - mouse behaves similarly to a touchpad
## absolute - mouse moves to the exact touch position
## touchsceen - emulates touchscreen inputs on the host
# mouse_mode = relative

## Dual screen. One H.264 stream is cropped: tv_region goes to the TV and
## drc_region goes to the GamePad. Regions are left,top,right,bottom in
## normalized picture coordinates, with no spaces.
## Defaults if dualscreen is on and the region lines are removed:
##   tv_region  = 0,0,1,0.5
##   drc_region = 0,0.5,1,1
##
## These values match a 1920x1080 desktop capture of Citra Nightly maximized,
## layout Large Screen (layout_option=2, large_screen_proportion=4,
## small_screen_position=BottomRight, swap_screen=false). The 3DS top screen
## is the large area on the left; the touch screen sits at the bottom right.
## Keep the stream 16:9 (1280x720 or 1920x1080) so Sunshine does not stretch it.
## mouse_mode=absolute maps the GamePad stylus onto that bottom-right screen.
width = 1280
height = 720
fps = 30
## 10000 fills the Wii U's 2.4 GHz link. Video still looks fine, but the
## control ACKs stop getting through and Sunshine drops the session after
## about 30 seconds (ENet's timeout) with error -1. 5000 leaves airtime
## for those packets at 720p30. Raise this only with a USB LAN adapter.
bitrate = 5000
dualscreen = true
tv_region = 0,0.041739,0.833984,0.933913
drc_region = 0.833984,0.711304,1,0.933913
mouse_mode = absolute
app = Desktop
## Optional. Uncomment only if Citra has no gamepad profile. It also sends the
## GamePad as Citra's default keyboard keys, on top of the Xbox pad.
#citra_input = true

## Output rotation (independent of xrandr or framebuffer settings!)
## Allowed values: 0, 90, 180, 270
#rotate = 0

## Bitrate depends by default on resolution and fps
## Set to -1 to enable default
## 20Mbps (20000) for 1080p (60 fps)
## 10Mbps (10000) for 1080p or 60 fps
## 5Mbps (5000) for lower resolution or fps
#bitrate = -1

## Size of network packets should be lower than MTU
## If streaming with WAN optimizations, this will be capped at 1024.
#packetsize = 1392

## Default started application on host
## The active block above uses Desktop, which is Sunshine's desktop capture.
#app = Steam

## Play audio on host instead of streaming to client
#localaudio = false

## Send quit app request to remote after quitting session
#quitappafter = false

## Disable all input processing (view-only mode)
#viewonly = false

## Enable QOS settings to optimize for internet or local network
## yes - optimize for WAN streaming
## no - optimize for LAN streaming
## auto (default) - decide automatically based on target IP address
#remote = auto

## Enable 5.1/7.1 surround sound
#surround = 5.1
